<app-loader [loading]="loading" message="Loading playlists..."></app-loader>

<div class="user-playlists-container" *ngIf="!loading">
  <header class="page-header">
    <a class="back-link" (click)="goBackToProfile()">← Back to Profile</a>
    <h1>{{ username }}'s Playlists</h1>
    <p class="playlist-count" *ngIf="playlists.length > 0">{{ playlists.length }} playlists</p>
  </header>

  <div class="error-state" *ngIf="error">
    <span class="error-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg></span>
    <h2>{{ error }}</h2>
    <button class="retry-btn" (click)="loadPlaylists()">Try Again</button>
  </div>

  <div class="empty-state" *ngIf="!error && playlists.length === 0">
    <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></span>
    <h2>No playlists found</h2>
    <p>This user hasn't created any playlists yet.</p>
  </div>

  <div class="playlists-grid" *ngIf="playlists.length > 0">
    <div class="playlist-card" *ngFor="let playlist of playlists" (click)="goToPlaylist(playlist)">
      <div class="playlist-artwork">
        <img [src]="getArtworkUrl(playlist)" [alt]="playlist.title"
             (error)="onImageError($event, 'assets/img/default-artwork.png')">
        <div class="playlist-overlay">
          <button 
            class="add-all-btn"
            (click)="addPlaylistToQueue(playlist); $event.stopPropagation()"
            title="Add all tracks to crate">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="playlist-info">
        <h3 class="playlist-title">{{ playlist.title }}</h3>
        <p class="playlist-meta">
          {{ playlist.track_count }} tracks • {{ getTotalDuration(playlist) }}
        </p>
      </div>
    </div>
  </div>
</div>
